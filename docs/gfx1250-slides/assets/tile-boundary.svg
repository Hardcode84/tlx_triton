<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320">
  <title>Refill released LDS slots while the current tile continues to compute</title>
  <desc>Schematic timeline. After all readers have copied operands to VGPRs, slot 0 receives the next tile's K0 and slot 1 receives K1. Transfers overlap remaining computation. Wait for prefetched data before using it.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#536a7b" stroke-width="1.5"/></marker></defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="19">
    <path d="M170 30H1100" stroke="#536a7b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="170" y="20" fill="#536a7b" font-size="16">Time → schematic, not cycle-accurate</text>
    <text x="365" y="66" fill="#275dbe">Current tile: final two K blocks</text>
    <text x="932" y="66" fill="#007e80">Next tile</text>
    <path d="M880 48V277" stroke="#536a7b" stroke-width="2" stroke-dasharray="6 5"/>
    <g fill="#172c40"><text x="0" y="115">Compute</text><text x="0" y="188">LDS slot 0</text><text x="0" y="258">LDS slot 1</text></g>
    <rect x="300" y="84" width="235" height="52" rx="7" fill="#e0eaf9"/>
    <rect x="545" y="84" width="325" height="52" rx="7" fill="#e0eaf9"/>
    <g text-anchor="middle" fill="#275dbe"><text x="417" y="116">WMMA: penultimate K</text><text x="707" y="116">WMMA: final K</text></g>
    <rect x="892" y="84" width="225" height="52" rx="7" fill="#dcefea"/>
    <g text-anchor="middle" fill="#007e80" font-size="17"><text x="1004" y="106">Wait for prefetched data</text><text x="1004" y="127">before use</text></g>
    <rect x="170" y="158" width="130" height="48" rx="7" fill="#e0eaf9"/>
    <rect x="390" y="228" width="155" height="48" rx="7" fill="#e0eaf9"/>
    <g fill="#275dbe" text-anchor="middle" font-size="17"><text x="235" y="178">Last reads</text><text x="235" y="198">→ VGPRs</text><text x="467" y="248">Last reads</text><text x="467" y="268">→ VGPRs</text></g>
    <g stroke="#536a7b" stroke-width="2" marker-end="url(#arrow)"><path d="M307 182H382"/><path d="M552 252H627"/></g>
    <g fill="#536a7b" font-size="15" text-anchor="middle"><text x="344" y="153">Release</text><text x="589" y="223">Release</text></g>
    <rect x="390" y="158" width="335" height="48" rx="7" fill="#dcefea"/>
    <rect x="635" y="228" width="235" height="48" rx="7" fill="#dcefea"/>
    <g fill="#007e80" text-anchor="middle"><text x="557" y="188">TDM: next tile K0</text><text x="752" y="258">TDM: next tile K1</text></g>
    <text x="170" y="310" fill="#536a7b" font-size="16">Release = all readers finish and synchronize. Each slot holds A and B operands.</text>
  </g>
</svg>
