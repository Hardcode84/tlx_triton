<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="218" viewBox="0 0 1120 218">
  <title>Full output staging exceeds LDS capacity; chunked staging fits</title>
  <g font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="20">
    <text x="0" y="66" fill="#ffffff">Full C staging</text><text x="0" y="146" fill="#ffffff">Hybrid staging</text>
    <rect x="240" y="30" width="512" height="58" rx="0" fill="#10353b"/><rect x="752" y="30" width="256" height="58" rx="0" fill="#43191b"/>
    <rect x="240" y="110" width="512" height="58" rx="0" fill="#10353b"/><rect x="752" y="110" width="32" height="58" rx="0" fill="#393323"/><rect x="784" y="110" width="32" height="58" rx="0" fill="#49402a"/><path d="M784 110V168" stroke="#c1a968" stroke-width="2"/>
    <g text-anchor="middle"><text x="496" y="66" fill="#00c2de">Input rings · 256 KiB</text><text x="880" y="66" fill="#ff8b8f">C · 128 KiB</text><text x="496" y="146" fill="#00c2de">Input rings · 256 KiB</text><text x="768" y="146" fill="#c1a968">0</text><text x="800" y="146" fill="#c1a968">1</text><text x="784" y="104" fill="#c1a968" font-size="16">C · 32 KiB total</text></g>
    <path d="M880 14V182" stroke="#c1a968" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="899" y="135" fill="#c1a968" font-size="18">320 KiB limit</text><text x="899" y="161" fill="#bfbfbf" font-size="16">before layout overhead</text>
    <text x="240" y="205" fill="#bfbfbf" font-size="17">Slot 0 · 16 KiB: C0 → C2 → C4 → C6</text><text x="659" y="205" fill="#bfbfbf" font-size="17">Slot 1 · 16 KiB: C1 → C3 → C5 → C7</text>
