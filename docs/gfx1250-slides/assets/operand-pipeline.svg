<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370">
  <title>One steady K128 phase: four LDS and WMMA scheduling regions</title>
  <desc>Load the next K32 subtile before each current dot. Compiler scheduling barriers follow each dot. After region 2, release the current LDS slot and issue TDM for block i+2. Wait for block i+1 before loading its first subtile in region 3.</desc>
  <g font-family="Liberation Sans, Arial, DejaVu Sans, sans-serif" font-size="18">
    <text x="0" y="24" fill="#ffffff" font-size="21">Steady K loop: chunk → phase 0, phase 1 → next chunk</text>
    <text x="0" y="53" fill="#bfbfbf">One phase = K128 block i = four K32 dots. Slot = i % 2. Subtile 0 is already in VGPRs.</text>
    <g fill="#1a1a1a" stroke="#595959"><rect x="150" y="76" width="230" height="250" rx="0"/><rect x="390" y="76" width="230" height="250" rx="0"/><rect x="630" y="76" width="230" height="250" rx="0"/><rect x="870" y="76" width="248" height="250" rx="0"/></g>
    <g text-anchor="middle" fill="#bfbfbf"><text x="265" y="101">Region 0</text><text x="505" y="101">Region 1</text><text x="745" y="101">Region 2</text><text x="994" y="101">Region 3</text></g>
    <g fill="#ffffff"><text x="0" y="139">TDM</text><text x="0" y="162" font-size="15">Global → LDS</text><text x="0" y="232">LDS reads</text><text x="0" y="255" font-size="15">LDS → VGPRs</text><text x="0" y="296">WMMA</text></g>
    <text x="505" y="141" text-anchor="middle" fill="#00c2de">Block i+1 was issued earlier into the other slot</text>
    <path d="M174 162H833" stroke="#00c2de" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="880" y="114" width="228" height="81" rx="0" fill="#10353b"/>
    <g text-anchor="middle" fill="#00c2de" font-size="17"><text x="994" y="136">Release slot i % 2</text><text x="994" y="160">Issue TDM: block i+2</text><text x="994" y="184">Wait / handoff: block i+1</text></g>
    <g fill="#10353b"><rect x="160" y="208" width="210" height="48" rx="0"/><rect x="400" y="208" width="210" height="48" rx="0"/><rect x="640" y="208" width="210" height="48" rx="0"/><rect x="880" y="208" width="228" height="48" rx="0"/></g>
    <g text-anchor="middle" fill="#00c2de"><text x="265" y="237">Load i: subtile 1</text><text x="505" y="237">Load i: subtile 2</text><text x="745" y="237">Load i: subtile 3</text><text x="994" y="237">Load i+1: subtile 0</text></g>
    <g fill="#393323"><rect x="160" y="267" width="210" height="48" rx="0"/><rect x="400" y="267" width="210" height="48" rx="0"/><rect x="640" y="267" width="210" height="48" rx="0"/><rect x="880" y="267" width="228" height="48" rx="0"/></g>
    <g text-anchor="middle" fill="#c1a968"><text x="265" y="296">Dot i: subtile 0</text><text x="505" y="296">Dot i: subtile 1</text><text x="745" y="296">Dot i: subtile 2</text><text x="994" y="296">Dot i: subtile 3</text></g>
    <g stroke="#c1a968" stroke-width="3" stroke-dasharray="5 4"><path d="M384 199V326"/><path d="M624 199V326"/><path d="M864 109V326"/><path d="M1118 199V326"/></g>
    <path d="M150 350H184" stroke="#c1a968" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="194" y="356" fill="#c1a968">amd_sched_barrier() after each dot · compiler boundary, no hardware barrier</text>
  </g>
</svg>
